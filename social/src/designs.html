/* Same tokens as the landing page */
:root{
  --navy:#0F1F5C;--navy-deep:#0A1645;--green:#13934A;--red:#E1262D;--wa:#1FAF55;--ochre:#F2B33D;--terracotta:#D2693C;
  --bg:#F7F5F0;--card:#FFFFFF;--ink:#101A3E;--muted:#59627F;--line:#E2DED3;--soft:#EFEBE1;--green-soft:#E3F4EA;--red-soft:#FCE6E7;
  --sky-top:#BFE3F5;--sky-mid:#FCEFD9;--sky-low:#FFE2BD;--street:#E9D8B8;
  --f-display:"Alexandria","Readex Pro",sans-serif;--f-body:"Readex Pro",sans-serif;--f-stamp:"Bungee","Alexandria",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:#ddd}
.frame{position:relative;width:1080px;overflow:hidden;color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column}
.post{height:1350px;padding:72px 80px 64px}
.story{height:1920px;padding:250px 90px 340px}   /* keeps clear of Instagram's top bar and reply field */
[dir="rtl"] .frame{font-family:var(--f-body)}

.bg-sky{background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 58%,var(--sky-low))}
.bg-cream{background:var(--bg)}
.bg-navy{background:radial-gradient(120% 80% at 85% 0%,#1B3296,var(--navy) 50%,var(--navy-deep));color:#fff}
.bg-green{background:linear-gradient(160deg,#17A653,#0B6E36);color:#fff}

/* brand row */
.brand{display:flex;align-items:center;gap:18px;position:relative;z-index:3}
.cup{width:76px;height:76px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -10px rgba(15,31,92,.4)}
.cup img{width:56px;height:56px}
.wordmark{font:400 34px/1 var(--f-stamp);color:var(--navy)}
.wordmark small{display:block;font:500 19px/1.2 var(--f-body);color:var(--muted);margin-top:6px}
.bg-navy .wordmark,.bg-green .wordmark{color:#fff}
.bg-navy .wordmark small,.bg-green .wordmark small{color:rgba(255,255,255,.75)}

.eyebrow{font:400 26px/1.2 var(--f-stamp);letter-spacing:.04em;text-transform:uppercase;color:var(--green)}
[lang="ar"] .eyebrow{font:800 34px/1.3 var(--f-display);letter-spacing:0}
.bg-navy .eyebrow,.bg-green .eyebrow{color:#7FE3A8}
.pos{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;background:rgba(255,255,255,.75);border:2px solid rgba(15,31,92,.1);border-radius:999px;padding:14px 26px;font:500 26px/1.2 var(--f-body);color:var(--navy)}
.pos i{width:16px;height:16px;border-radius:50%;background:var(--green);box-shadow:0 0 0 7px rgba(19,147,74,.2)}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;text-wrap:balance;font-weight:900}
[lang="ar"] h1,[lang="ar"] h2{line-height:1.3}
.h-xl{font-size:104px}
[lang="ar"] .h-xl{font-size:88px}
.story .face{width:330px;height:380px}
.post .face{width:290px;height:330px}
.center{flex:1;justify-content:center}
.h-l{font-size:84px}
.h-m{font-size:64px}
.h-s{font-size:46px}
em{font-style:normal;color:var(--green);position:relative;white-space:nowrap}
em::after{content:"";position:absolute;inset-inline:0;bottom:.02em;height:.15em;border-radius:99px;background:linear-gradient(90deg,var(--green) 0 33%,#fff 33% 66%,var(--red) 66%);z-index:-1}
.bg-navy em{color:#7FE3A8}
.lead{font:400 34px/1.45 var(--f-body);color:var(--muted)}
.bg-navy .lead,.bg-green .lead{color:rgba(255,255,255,.82)}
.stack{display:flex;flex-direction:column;gap:30px;position:relative;z-index:2}
.grow{flex:1}

/* CTA + footer */
.cta{display:inline-flex;align-items:center;gap:18px;align-self:flex-start;background:var(--wa);color:#fff;border-radius:999px;padding:24px 40px;font:800 34px/1.1 var(--f-display);box-shadow:0 18px 40px -18px rgba(31,175,85,.9)}
.cta svg{width:42px;height:42px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;font:600 24px/1.2 var(--f-body);color:var(--muted);position:relative;z-index:3;direction:ltr}
.bg-navy .foot,.bg-green .foot{color:rgba(255,255,255,.8)}
.tricolor{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--green) 0 33.3%,#fff 33.3% 66.6%,var(--red) 66.6%);box-shadow:0 0 0 1px rgba(15,31,92,.06)}

/* scene (hero) */
.scene{position:absolute;inset:auto 0 0;height:560px;direction:ltr;z-index:1}
.scene .sky-strip{position:absolute;left:-40px;bottom:46px;height:360px}
.scene .street{position:absolute;inset:auto 0 0;height:54px;background:var(--street)}
.scene .street::before{content:"";position:absolute;inset:24px 0 auto;height:5px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);opacity:.7}
.scene .pp{position:absolute;bottom:14px;height:330px}
.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#FFE08A 0 55%,rgba(255,214,120,0) 70%)}
.toast{position:absolute;display:flex;align-items:center;gap:18px;background:#fff;border-radius:28px;padding:20px 28px;box-shadow:0 20px 40px -20px rgba(15,31,92,.6);z-index:4;color:var(--navy)}
.toast img{width:60px;height:60px;border-radius:16px;border:2px solid var(--line);padding:5px}
.toast small{display:block;font:500 20px/1.2 var(--f-body);color:var(--muted)}
.toast b{display:block;font:800 30px/1.2 var(--f-display)}

/* quiz chips */
.qcard{background:#fff;border-radius:40px;padding:48px;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 60px -30px rgba(15,31,92,.45)}
.qcard h3{font-size:46px;font-weight:800}
.chip{display:flex;align-items:center;gap:22px;border:3px solid var(--line);background:var(--bg);border-radius:24px;padding:22px 28px;font:600 34px/1.2 var(--f-body)}
.chip .e{font-size:44px}
.chip.on{border-color:var(--green);background:var(--green-soft)}
.qcard.compact{padding:38px 40px;gap:14px}.qcard.compact .chip{padding:16px 26px}.qcard.compact h3{font-size:42px}
.dots{display:flex;gap:12px}.dots i{width:54px;height:12px;border-radius:99px;background:var(--soft)}.dots i.on{background:var(--green)}

/* worry → answer */
.wq{position:relative;background:var(--red-soft);border-radius:36px;padding:34px 40px;font:800 50px/1.25 var(--f-display);color:var(--ink)}
.wa{display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:start;background:var(--green-soft);border-radius:36px;padding:34px 40px;font:500 36px/1.4 var(--f-body);color:var(--ink)}
.tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font:800 36px/1 var(--f-display)}
.faces{display:flex;align-items:flex-end;gap:30px}
.face{width:250px;height:290px;border-radius:44px;overflow:hidden;position:relative;background:var(--soft)}
.face img{position:absolute;inset:auto 0 -14px;width:100%}
.face.happy{background:var(--green-soft)}
.arrow{font:900 80px/1 var(--f-display);color:var(--green)}
[dir="rtl"] .arrow{transform:scaleX(-1)}
.who{align-self:flex-start;font:600 24px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--soft);padding:12px 20px;border-radius:99px}
[lang="ar"] .who{letter-spacing:0;font-size:28px}

/* fees bars */
.big{font:900 150px/1 var(--f-display);color:var(--green);direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .big{text-align:right}
.bars{display:flex;flex-direction:column;gap:30px;background:#fff;border-radius:36px;padding:44px}
.bar{display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;font:600 32px/1 var(--f-body)}
.bar-top span{color:var(--muted);direction:ltr;unicode-bidi:isolate}
.track{height:24px;border-radius:99px;background:var(--soft);overflow:hidden}
.fill{height:100%;border-radius:99px;background:#9AA1B9}
.bar.it .fill{background:linear-gradient(90deg,var(--green),var(--red))}
.bar.it b{color:var(--green)}
.note{font:400 24px/1.4 var(--f-body);color:var(--muted)}
.bg-navy .note,.bg-green .note{color:rgba(255,255,255,.7)}

/* postcard */
.pc{background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(15,31,92,.55);transform:rotate(-2deg)}
.pc-art{position:relative;height:560px;background:linear-gradient(180deg,#BFE3F5,#FCEFD9 80%);direction:ltr;overflow:hidden}
.pc-art .ground{position:absolute;inset:auto 0 0;height:40px;background:var(--street)}
.pc-art img{position:absolute;bottom:22px}
.stamp{position:absolute;top:28px;right:28px;width:130px;height:150px;background:#fff;border:5px dashed var(--terracotta);border-radius:8px;display:grid;place-items:center;font:400 22px/1.1 var(--f-stamp);color:var(--terracotta);text-align:center;transform:rotate(6deg);z-index:2}
.stamp b{display:block;font-size:44px}
.pc-body{padding:40px 48px 48px;display:flex;flex-direction:column;gap:14px}
.pc-body h3{font-size:56px;font-weight:900}
.pc-body p{font:400 32px/1.45 var(--f-body);color:var(--muted)}

/* roadmap */
.steps{display:flex;flex-direction:column;gap:22px}
.step{display:grid;grid-template-columns:96px 1fr;gap:28px;align-items:center;background:#fff;border-radius:32px;padding:26px 32px}
.pin{width:84px;height:84px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--navy);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:400 34px/1 var(--f-stamp)}
.step:nth-child(3) .pin{background:var(--green)}.step:nth-child(4) .pin{background:var(--red)}
.step h3{font-size:44px;font-weight:800}
.step p{font:600 26px/1.3 var(--f-body);color:var(--muted);margin-top:6px}

/* KPIs */
.kpis{display:flex;flex-direction:column;gap:26px}
.kpi{display:flex;align-items:baseline;gap:34px;border-bottom:2px solid rgba(255,255,255,.18);padding-bottom:26px}
.kpi:last-child{border-bottom:0}
.kpi b{font:900 150px/1 var(--f-display);min-width:360px;direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .kpi b{text-align:right}
.kpi:nth-child(1) b{color:#3DDC84}.kpi:nth-child(2) b{color:#fff}.kpi:nth-child(3) b{color:#FF6B70}
.kpi span{font:600 38px/1.3 var(--f-body);color:rgba(255,255,255,.88)}

/* plans */
.plans{display:flex;flex-direction:column;gap:22px}
.plan{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 24px;background:#fff;border:3px solid var(--line);border-radius:32px;padding:30px 38px;position:relative}
.plan.rec{border-color:var(--green);box-shadow:0 30px 60px -30px rgba(19,147,74,.7)}
.plan h3{font:400 40px/1 var(--f-stamp);color:var(--ink)}
.plan .span{font:600 28px/1.3 var(--f-body);color:var(--muted);grid-column:1}
.plan .price{grid-row:1/3;grid-column:2;font:900 72px/1 var(--f-display);color:var(--ink);direction:ltr;unicode-bidi:isolate}
.badge{position:absolute;top:-24px;inset-inline-start:34px;background:var(--green);color:#fff;font:400 22px/1 var(--f-stamp);padding:12px 18px;border-radius:99px}
[lang="ar"] .badge{font:800 26px/1 var(--f-display)}

/* myth / fact */
.myth{background:#fff;border-radius:36px;padding:44px;display:flex;flex-direction:column;gap:18px}
.myth .tag{align-self:flex-start;font:400 26px/1 var(--f-stamp);padding:12px 20px;border-radius:99px}
[lang="ar"] .myth .tag{font:800 30px/1 var(--f-display)}
.myth.no .tag{background:var(--red-soft);color:var(--red)}
.myth.yes .tag{background:var(--green-soft);color:var(--green)}
.myth p{font:800 52px/1.25 var(--f-display);color:var(--ink)}
.myth.no p{text-decoration:line-through;text-decoration-color:rgba(225,38,45,.6);text-decoration-thickness:6px}

.sticker-space{height:300px}  /* left empty: the Instagram sticker goes here */
.mascot{position:absolute;width:640px}
[dir="rtl"] .mascot{transform:scaleX(-1)}
</style>
</head>

/* ---- building blocks ---- */
const brand = () => `<div class="brand"><span class="cup"><img src="${A}cup.webp" alt=""></span><span class="wordmark">ESPRESSO STUDY<small>${L(C.tagline)}</small></span></div>`;
const foot = () => `<div class="foot"><span>@espresso.study</span><span>WhatsApp +39 327 599 0381</span></div>`;
const cta = (t) => `<span class="cta">${WA_SVG}<span>${t || L(C.cta)}</span></span>`;
const toast = (t, style) => `<div class="toast" style="${style}"><img src="${A}cup.webp" alt=""><div><small>${L(C.toast_from)}</small><b>${t}</b></div></div>`;
const scene = (h, people) => `<div class="scene" style="height:${h}px"><div class="sun" style="right:90px;top:30px"></div>
  <img class="sky-strip" src="${A}italy/skyline.svg" alt="">
  <div class="street"></div>${people}</div>`;
const worry = (k, big) => { const w = WORRIES[k];
  return `<span class="who">${L(C[w.who])}</span>
   <div class="faces"><div class="face"><img src="${A}peeps/b-${w.p}-worry.svg" alt=""></div><span class="arrow">→</span><div class="face happy"><img src="${A}peeps/b-${w.p}-happy.svg" alt=""></div></div>
   <p class="wq"${big?' style="font-size:58px"':''}>“${L(w.q)}”</p>
   <div class="wa"><span class="tick">✓</span><span>${L(w.a)}</span></div>`; };
const bars = () => `<div class="bars">${C.bars.map(([it,n,v,lab])=>`<div class="bar${it?" it":""}"><div class="bar-top"><b>${L(n)}</b><span>${lab}</span></div><div class="track"><div class="fill" style="width:${Math.max(3,v/30000*100)}%"></div></div></div>`).join("")}</div>`;
const steps = () => `<div class="steps">${C.road.map(([t,w],i)=>`<div class="step"><span class="pin"><span>${i+1}</span></span><div><h3>${L(t)}</h3><p>${L(w)}</p></div></div>`).join("")}</div>`;
const kpis = () => `<div class="kpis">${C.kpis.map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${L(l)}</span></div>`).join("")}</div>`;
const plans = () => `<div class="plans">${C.plans.map(([n,s,pe,pa,rec])=>`<div class="plan${rec?" rec":""}">${rec?`<span class="badge">${L(C.rec)}</span>`:""}<h3>${n}</h3><span class="span">${L(s)}</span><span class="price">${lang==="ar"?pa:pe}</span></div>`).join("")}</div>`;
const chips = (sel) => C.fields.map(([e,t],i)=>`<div class="chip${i===sel?" on":""}"><span class="e">${e}</span><span>${L(t)}</span></div>`).join("");
const postcard = (art, h, p, rot) => `<div class="pc" style="transform:rotate(${rot}deg)"><div class="pc-art">${art}</div><div class="pc-body"><h3>${h}</h3><p>${p}</p></div></div>`;
